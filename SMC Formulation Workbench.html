<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>SMC Formulation Workbench</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#17212b;
    --panel2:#1d2a36;
    --soft:#253545;
    --text:#e8eef4;
    --muted:#aebdca;
    --accent:#3aa3ff;
    --accent2:#4ad29f;
    --warn:#ffb648;
    --danger:#ff6b6b;
    --ok:#4ddf92;
    --line:#2d4154;
    --card:#13202a;
    --shadow:0 10px 24px rgba(0,0,0,.25);
    --radius:14px;
    --radius-sm:10px;
    --touch:42px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif}
  body{min-height:100vh}
  button,input,select,textarea{font:inherit}
  a{color:var(--accent)}
  .app{
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:linear-gradient(180deg,#101820,#13222c);
    border-right:1px solid var(--line);
    padding:14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow:auto;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;padding:10px;border-radius:12px;background:var(--panel);
    box-shadow:var(--shadow)
  }
  .brand-badge{
    width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:700;color:#081019
  }
  .brand h1{font-size:16px;line-height:1.2;margin:0}
  .brand small{display:block;color:var(--muted)}
  .offline{
    margin:10px 0 14px;
    padding:10px 12px;border:1px solid var(--line);background:#10222c;border-radius:10px;color:#9ce3ff;
    font-size:12px
  }
  .nav{
    display:flex;flex-direction:column;gap:8px
  }
  .nav button{
    width:100%;text-align:left;border:none;border-radius:12px;padding:12px;background:var(--panel);color:var(--text);
    cursor:pointer;min-height:var(--touch)
  }
  .nav button.active,.nav button:hover{background:var(--soft)}
  .main{
    padding:16px;
    overflow:auto;
  }
  .topbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px
  }
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px
  }
  .btn{
    border:none;background:var(--accent);color:white;padding:11px 14px;border-radius:12px;cursor:pointer;min-height:var(--touch)
  }
  .btn.secondary{background:var(--panel2);border:1px solid var(--line)}
  .btn.good{background:var(--accent2);color:#082116}
  .btn.warn{background:var(--warn);color:#332000}
  .btn.danger{background:var(--danger)}
  .btn.small{padding:8px 10px;border-radius:10px}
  .layout{
    display:grid;gap:14px
  }
  .grid-2{grid-template-columns:1fr 1fr}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .card h2,.card h3,.card h4{margin:0 0 10px}
  .subtle{color:var(--muted)}
  .kpi-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px
  }
  .kpi{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;padding:14px
  }
  .kpi .label{color:var(--muted);font-size:12px}
  .kpi .value{font-size:24px;font-weight:700;margin-top:6px}
  .kpi .status{font-size:12px;margin-top:8px}
  .ok{color:var(--ok)}
  .warn{color:var(--warn)}
  .danger{color:var(--danger)}
  .section-title{
    display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px
  }
  .form-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px
  }
  label{
    display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)
  }
  input,select,textarea{
    background:#0f1a23;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px;min-height:var(--touch);width:100%
  }
  textarea{min-height:90px;resize:vertical}
  .table-wrap{
    overflow:auto;border:1px solid var(--line);border-radius:12px
  }
  table{width:100%;border-collapse:collapse;min-width:900px;background:var(--panel)}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#12202a;z-index:1}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{
    display:inline-block;padding:4px 8px;border-radius:999px;background:#133348;border:1px solid var(--line);font-size:12px
  }
  .alert-list{display:flex;flex-direction:column;gap:8px}
  .alert{
    padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#111c25
  }
  .alert.warn{border-color:#8d6b2f;background:#2b2414;color:#ffd48f}
  .alert.danger{border-color:#8a4040;background:#2c1717;color:#ffc3c3}
  .alert.ok{border-color:#2a6647;background:#102318;color:#b8f0d2}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tab-btn{
    border:none;padding:10px 12px;border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer
  }
  .tab-btn.active{background:var(--accent)}
  .hidden{display:none!important}
  .split{
    display:grid;grid-template-columns:1.15fr .85fr;gap:14px
  }
  canvas{
    width:100%;height:auto;background:#0f1a23;border:1px solid var(--line);border-radius:12px
  }
  .note{
    font-size:12px;color:var(--muted);line-height:1.5
  }
  .mini{
    font-size:12px;color:var(--muted)
  }
  .pill-row{display:flex;flex-wrap:wrap;gap:6px}
  .hr{height:1px;background:var(--line);margin:10px 0}
  .right{text-align:right}
  .center{text-align:center}
  .mono{font-family:Consolas,Monaco,monospace}
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px
  }
  .modal.show{display:flex}
  .modal-content{
    width:min(1100px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px
  }
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .list{
    display:flex;flex-direction:column;gap:8px
  }
  .list-item{
    border:1px solid var(--line);border-radius:12px;padding:12px;background:#12202a
  }
  .small-input{width:110px}
  .nowrap{white-space:nowrap}
  .sticky-actions{
    position:sticky;bottom:0;background:linear-gradient(180deg,rgba(23,33,43,0),rgba(23,33,43,1) 35%);
    padding-top:12px;margin-top:8px
  }

  @media (max-width:1100px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .form-grid,.grid-4,.grid-3,.grid-2,.split,.two-col,.three-col{grid-template-columns:1fr}
  }
  @media (max-width:700px){
    .main{padding:10px}
    .sidebar{padding:10px}
    .brand h1{font-size:14px}
    .kpi-grid{grid-template-columns:1fr}
    th,td{padding:8px}
    .btn{width:auto}
  }
</style>

/* -------------------------

const Util = {
  uid(prefix="ID"){
    return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8).toUpperCase();
  },
  today(){
    return new Date().toISOString().slice(0,10);
  },
  nowISO(){
    return new Date().toISOString();
  },
  fmt(n, d=2){
    const x = Number(n);
    if (!isFinite(x)) return "-";
    return x.toLocaleString(undefined, {maximumFractionDigits:d, minimumFractionDigits:d});
  },
  num(v, def=0){
    const x = parseFloat(v);
    return isFinite(x) ? x : def;
  },
  clone(obj){
    return JSON.parse(JSON.stringify(obj));
  },
  download(filename, content, type='application/json'){
    const blob = new Blob([content], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  },
  csvEscape(v){
    if (v == null) return '';
    const s = String(v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  },
  parseCSV(text){
    const rows = [];
    let row = [], cur = '', inQ = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], n = text[i+1];
      if(inQ){
        if(c === '"' && n === '"'){ cur += '"'; i++; }
        else if(c === '"'){ inQ = false; }
        else cur += c;
      }else{
        if(c === '"') inQ = true;
        else if(c === ','){ row.push(cur); cur = ''; }
        else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
        else if(c !== '\r') cur += c;
      }
    }
    row.push(cur); rows.push(row);
    return rows;
  },
  debounce(fn, ms=200){
    let t;
    return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
  }
};

/* -------------------------
   IndexedDB wrapper
------------------------- */
const DB = {
  db:null,
  name:"SMCWorkbenchDB",
  version:1,
  stores:[
    "appMeta","materials","suppliers","applications","presets","formulations",
    "revisions","priceHistory","experimentalData","equations","settings","inventory"
  ],
  open(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(this.name, this.version);
      req.onupgradeneeded = e=>{
        const db = e.target.result;
        this.stores.forEach(s=>{
          if(!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath:"id"});
        });
      };
      req.onsuccess = e=>{ this.db = e.target.result; resolve(this.db); };
      req.onerror = e=> reject(e);
    });
  },
  tx(store, mode='readonly'){
    return this.db.transaction(store, mode).objectStore(store);
  },
  getAll(store){
    return new Promise((resolve,reject)=>{
      const req = this.tx(store).getAll();
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = reject;
    });
  },
  get(store, id){
    return new Promise((resolve,reject)=>{
      const req = this.tx(store).get(id);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = reject;
    });
  },
  put(store, item){
    return new Promise((resolve,reject)=>{
      const req = this.tx(store,'readwrite').put(item);
      req.onsuccess = ()=>resolve(item);
      req.onerror = reject;
    });
  },
  bulkPut(store, items){
    return Promise.all(items.map(i=>this.put(store,i)));
  },
  delete(store, id){
    return new Promise((resolve,reject)=>{
      const req = this.tx(store,'readwrite').delete(id);
      req.onsuccess = ()=>resolve(true);
      req.onerror = reject;
    });
  },
  clear(store){
    return new Promise((resolve,reject)=>{
      const req = this.tx(store,'readwrite').clear();
      req.onsuccess = ()=>resolve(true);
      req.onerror = reject;
    });
  }
};

/* -------------------------
   Data bootstrap
------------------------- */
async function loadAllData(){
  for(const store of DB.stores){
    State.data[store] = await DB.getAll(store);
  }
  const meta = State.data.appMeta[0];
  if(!meta){
    const init = createInitialData();
    for(const store of DB.stores){
      await DB.bulkPut(store, init[store] || []);
      State.data[store] = init[store] || [];
    }
  }
  const savedView = localStorage.getItem("smc-current-view");
  if(savedView) State.currentView = savedView;
  if(State.data.formulations.length && !State.activeFormulationId){
    State.activeFormulationId = State.data.formulations[0].id;
  }
}
async function saveAllData(){
  for(const store of DB.stores){
    if(Array.isArray(State.data[store])){
      await DB.clear(store);
      if(State.data[store].length) await DB.bulkPut(store, State.data[store]);
    }
  }
}

/* -------------------------
   Currency & cost
------------------------- */
const Finance = {
  toINR(value, currency){
    const rates = getSettings().exchangeRates || {};
    if(currency === "INR" || !currency) return Util.num(value);
    return Util.num(value) * Util.num(rates[currency],1);
  },
  fromINR(valueINR, currency){
    const rates = getSettings().exchangeRates || {};
    if(currency === "INR" || !currency) return Util.num(valueINR);
    return Util.num(valueINR) / Util.num(rates[currency],1);
  },
  landedCostPerKg(item){
    const lp = item.logistics || {};
    const toggles = lp.toggles || {};
    const base = Util.num(item.pricePerKg);
    let v = base;
    if(toggles.freight) v += Util.num(lp.freight);
    if(toggles.insurance) v += Util.num(lp.insurance);
    if(toggles.duty) v += Util.num(lp.duty);
    if(toggles.gst) v += Util.num(lp.gst);
    if(toggles.other) v += Util.num(lp.other);
    return v;
  }
};

/* -------------------------
   Property engine
------------------------- */
const Calc = {
  normalizeIfEnabled(form){
    const sum = form.items.reduce((s,x)=>s+Util.num(x.percent),0);
    if(form.autoNormalize && sum > 0){
      form.items.forEach(x=>x.percent = Util.num(x.percent) * 100 / sum);
    }
  },

  hydrateItemFromMaterial(item){
    if(!item.materialId) return;
    const m = getMaterial(item.materialId);
    if(!m) return;
    item.ingredient = m.materialName || item.category;
    item.supplier = m.supplier || "";
    item.grade = m.grade || "";
    item.pricePerKg = Util.num(m.pricePerKg);
    item.currency = m.currency || "INR";
    item.density = Util.num(m.density);
    item.function = item.category;
    item.logistics = item.logistics || {};
    item.logistics.priceSource = m.sourceType || "";
    item.logistics.priceDate = m.lastPriceUpdate || m.date || "";
  },

  computeFormulation(form){
    this.normalizeIfEnabled(form);

    const batch = Util.num(form.targetWeightKg, 500);
    form.items.forEach(item=>{
      item.kgBatch = batch * Util.num(item.percent)/100;
      item.costPerKg = Finance.landedCostPerKg(item);
      item.totalCost = item.kgBatch * item.costPerKg;
    });

    const totalPercent = form.items.reduce((s,x)=>s+Util.num(x.percent),0);
    const totalBatchKg = form.items.reduce((s,x)=>s+Util.num(x.kgBatch),0);
    const totalMaterialCost = form.items.reduce((s,x)=>s+Util.num(x.totalCost),0);
    const formulationCostPerKg = totalBatchKg>0 ? totalMaterialCost/totalBatchKg : 0;

    const itemWithMat = form.items.map(item=>({
      ...item,
      mat: item.materialId ? getMaterial(item.materialId) : null
    }));

    const props = {};

    // density via inverse rule on weight fractions
    const weightFractions = itemWithMat.map(it=>Util.num(it.percent)/100);
    const denom = itemWithMat.reduce((s,it)=>{
      const rho = Util.num(it.density || (it.mat ? it.mat.density : 0));
      if(rho>0) return s + (Util.num(it.percent)/100)/rho;
      return s;
    },0);
    props.density = denom>0 ? 1/denom : 0;
    props.specificGravity = props.density / 1.0;

    const sumByCat = (cats)=> itemWithMat.filter(it=>cats.includes(it.category)).reduce((s,it)=>s+Util.num(it.percent),0);
    props.fiberContent = sumByCat(["Glass Fiber"]);
    props.fillerContent = sumByCat(["Calcium Carbonate Filler","Flame Retardant","Conductive / Functional Additive"]);
    props.resinContent = sumByCat([
      "Unsaturated Polyester Resin","Low Profile Additive / Thermoplastic Modifier",
      "Low Shrink / Shrink Control Additive","Toughening / Impact Modifier"
    ]);
    props.frLoading = sumByCat(["Flame Retardant"]);

    const weightedProp = (key)=>{
      let sum = 0;
      itemWithMat.forEach(it=>{
        const w = Util.num(it.percent)/100;
        const src = it.mat || {};
        const p = Util.num(src[key], 0);
        sum += w * p;
      });
      const eq = getEquation(key);
      const cf = eq ? Util.num(eq.correctionFactor,1) : 1;
      return sum * cf;
    };

    PROPERTY_DEFS.forEach(pd=>{
      if(props[pd.key] !== undefined) return;
      if(pd.method==="weighted_average" || pd.method==="supplier-derived" || pd.method==="experimental" || pd.method==="unknown"){
        props[pd.key] = weightedProp(pd.key);
      }else if(pd.method==="category_sum"){
        props[pd.key] = props[pd.key] ?? 0;
      }
    });

    // derived processing adjustments from catalyst/accelerator/inhibitor
    const catPct = sumByCat(["Initiator / Catalyst"]);
    const accPct = sumByCat(["Accelerator / Promoter"]);
    const inhPct = sumByCat(["Inhibitor / Retarder"]);
    props.gelTime = Math.max(0.1, weightedProp("gelTime") - 0.7*catPct - 0.5*accPct + 0.5*inhPct);
    props.cureTime = Math.max(0.1, weightedProp("cureTime") - 0.4*catPct - 0.3*accPct + 0.2*inhPct);
    props.thickeningTime = Math.max(0.1, weightedProp("thickeningTime") - 0.3*sumByCat(["Thickening Agent"]));

    // estimated strength boost with glass content
    const glassFactor = 1 + props.fiberContent/100*0.9;
    props.tensileStrength *= glassFactor;
    props.flexuralStrength *= glassFactor;
    props.tensileModulus *= (1 + props.fiberContent/100*1.2);
    props.flexuralModulus *= (1 + props.fiberContent/100*1.2);
    props.impactStrength *= (1 + sumByCat(["Toughening / Impact Modifier"])/100*6);

    // shrinkage reduction from filler/LPA/LSA
    props.shrinkage = Math.max(0, weightedProp("shrinkage") - props.fillerContent*0.03 - sumByCat(["Low Profile Additive / Thermoplastic Modifier","Low Shrink / Shrink Control Additive"])*0.10);

    // fire index
    props.LOI = weightedProp("LOI") + props.frLoading*0.2;
    props.UL94 = weightedProp("UL94") + props.frLoading*0.25;

    // costs
    const c = form.costing || {};
    const scrapFactor = 1 + Util.num(c.scrapPercent)/100 + Util.num(c.processLossPercent)/100;
    const manufacturingCostPerKg = formulationCostPerKg*scrapFactor
      + Util.num(c.labourPerKg)+Util.num(c.energyPerKg)+Util.num(c.machinePerKg)
      + Util.num(c.toolingAmortizationPerKg)+Util.num(c.packagingPerKg)+Util.num(c.overheadPerKg);
    const sellingPricePerKg = manufacturingCostPerKg * (1 + Util.num(c.marginPercent)/100);

    return {
      totalPercent,
      totalBatchKg,
      totalMaterialCost,
      formulationCostPerKg,
      manufacturingCostPerKg,
      sellingPricePerKg,
      properties:props
    };
  },

  alerts(form, results){
    const alerts = [];
    const app = State.data.applications.find(a=>a.name===form.application || a.id===form.application);

    if(Math.abs(results.totalPercent - 100) > 0.001){
      alerts.push({type: Math.abs(results.totalPercent-100)>2 ? "danger":"warn", text:`Total composition = ${Util.fmt(results.totalPercent,2)}%, not 100%.`});
    }else{
      alerts.push({type:"ok", text:"Total composition = 100%."});
    }

    form.items.forEach(it=>{
      if(!it.materialId) alerts.push({type:"warn", text:`Missing material selection for "${it.category}".`});
      if(!Util.num(it.pricePerKg) && Util.num(it.percent)>0) alerts.push({type:"warn", text:`Missing price for "${it.category}".`});
      if(!Util.num(it.density) && Util.num(it.percent)>0) alerts.push({type:"warn", text:`Missing density for "${it.category}".`});
    });

    if(app){
      const tr = app.targetRanges || {};
      const checks = [
        ["glass", results.properties.fiberContent, "Glass loading"],
        ["filler", results.properties.fillerContent, "Filler loading"],
        ["resin", results.properties.resinContent, "Resin loading"],
        ["catalyst", form.items.filter(x=>x.category==="Initiator / Catalyst").reduce((s,x)=>s+Util.num(x.percent),0), "Catalyst"],
        ["accelerator", form.items.filter(x=>x.category==="Accelerator / Promoter").reduce((s,x)=>s+Util.num(x.percent),0), "Accelerator"],
        ["thickener", form.items.filter(x=>x.category==="Thickening Agent").reduce((s,x)=>s+Util.num(x.percent),0), "Thickener"],
        ["pigment", form.items.filter(x=>x.category==="Pigment / Colouring Agent").reduce((s,x)=>s+Util.num(x.percent),0), "Pigment"],
        ["fr", results.properties.frLoading, "Flame retardant loading"]
      ];
      checks.forEach(([k,v,lbl])=>{
        if(tr[k]){
          const [mn,mx] = tr[k];
          if(v<mn || v>mx) alerts.push({type:"warn", text:`${lbl} ${Util.fmt(v,2)} is outside preset target range ${mn}–${mx}.`});
        }
      });
    }

    if(form.targetCostPerKg && results.formulationCostPerKg > Util.num(form.targetCostPerKg)){
      alerts.push({type:"warn", text:`Formulation cost/kg exceeds target (${Util.fmt(results.formulationCostPerKg)} > ${Util.fmt(form.targetCostPerKg)}).`});
    }

    PROPERTY_DEFS.forEach(pd=>{
      const target = form.targetProperties?.[pd.key];
      if(!target) return;
      const val = results.properties[pd.key];
      if(target.min!=="" && val < Util.num(target.min)) alerts.push({type:"warn", text:`${pd.label} below target minimum.`});
      if(target.max!=="" && val > Util.num(target.max)) alerts.push({type:"warn", text:`${pd.label} above target maximum.`});
    });

    return alerts;
  },

  explainProperty(form, propertyKey){
    const results = this.computeFormulation(form);
    const pd = PROPERTY_DEFS.find(p=>p.key===propertyKey);
    const eq = getEquation(propertyKey);
    let body = `
      <div class="card">
        <h3>${pd ? pd.label : propertyKey}</h3>
        <p><b>Calculation method:</b> ${(eq?.method || pd?.method || "Unknown")}</p>
        <p><b>Equation:</b> <span class="mono">${(eq?.equation || pd?.equation || "-")}</span></p>
        <p><b>Correction factor:</b> ${Util.fmt(eq?.correctionFactor ?? 1,4)}</p>
        <p><b>Result:</b> ${Util.fmt(results.properties[propertyKey],4)} ${pd?.unit || ""}</p>
        <div class="hr"></div>
        <p><b>Inputs:</b></p>
        <div class="table-wrap"><table>
          <thead><tr><th>Ingredient</th><th>%</th><th>Material</th><th>Property Value</th></tr></thead>
          <tbody>
    `;
    form.items.forEach(it=>{
      const m = getMaterial(it.materialId) || {};
      body += `<tr>
        <td>${it.category}</td>
        <td>${Util.fmt(it.percent,3)}</td>
        <td>${m.materialName || "-"}</td>
        <td>${m[propertyKey] ?? "-"}</td>
      </tr>`;
    });
    body += `</tbody></table></div>
      <div class="hr"></div>
      <p><b>Assumptions:</b> Theoretical estimate only. Not a certified finished-part property.</p>
      <p><b>Data quality:</b> Material properties may be manufacturer-listed, supplier-listed, estimated, experimental, or user-entered. Verify before production use.</p>
      </div>`;
    return body;
  }
};

/* -------------------------
   Chart engine: canvas only
------------------------- */
const Charts = {
  clear(c){
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    return ctx;
  },
  fitCanvas(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(320, Math.floor(rect.width*dpr));
    canvas.height = Math.max(220, Math.floor((rect.height || 260)*dpr));
  },
  donut(canvas, labels, values, colors, title="Composition"){
    this.fitCanvas(canvas);
    const ctx = this.clear(canvas);
    const w = canvas.width, h = canvas.height;
    const cx = w*0.28, cy = h*0.5, r = Math.min(w,h)*0.28, ir = r*0.55;
    const total = values.reduce((a,b)=>a+b,0) || 1;
    let a0 = -Math.PI/2;
    values.forEach((v,i)=>{
      const a1 = a0 + (v/total)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,a0,a1);
      ctx.closePath();
      ctx.fillStyle = colors[i%colors.length];
      ctx.fill();
      a0 = a1;
    });
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(cx,cy,ir,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#e8eef4';
    ctx.font = `${Math.max(16,w*0.02)}px Segoe UI`;
    ctx.fillText(title, w*0.04, h*0.08);
    ctx.font = `${Math.max(14,w*0.018)}px Segoe UI`;
    ctx.fillText(`Total ${Util.fmt(total,2)}%`, cx-r*0.45, cy+4);

    let lx = w*0.58, ly = h*0.15;
    labels.forEach((lab,i)=>{
      ctx.fillStyle = colors[i%colors.length];
      ctx.fillRect(lx, ly-10, 14, 14);
      ctx.fillStyle = '#dce7f1';
      ctx.font = `${Math.max(12,w*0.015)}px Segoe UI`;
      ctx.fillText(`${lab}: ${Util.fmt(values[i],2)}`, lx+22, ly+2);
      ly += 24;
      if(ly > h-20){ ly = h*0.15; lx += 220; }
    });
  },
  bars(canvas, labels, values, title="Bar Chart", color='#3aa3ff'){
    this.fitCanvas(canvas);
    const ctx = this.clear(canvas);
    const w = canvas.width, h = canvas.height;
    const pad = {l:50,r:20,t:40,b:80};
    const max = Math.max(...values,1);
    ctx.fillStyle = '#e8eef4';
    ctx.font = `${Math.max(15,w*0.02)}px Segoe UI`;
    ctx.fillText(title, pad.l, 26);

    ctx.strokeStyle = '#31506b';
    ctx.lineWidth = 1;
    for(let i=0;i<=5;i++){
      const y = pad.t + (h-pad.t-pad.b)*i/5;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
      const val = max*(1-i/5);
      ctx.fillStyle = '#9fb4c6';
      ctx.font = `${Math.max(11,w*0.012)}px Segoe UI`;
      ctx.fillText(Util.fmt(val,1), 5, y+4);
    }

    const bw = (w-pad.l-pad.r)/Math.max(labels.length,1)*0.68;
    labels.forEach((lab,i)=>{
      const x = pad.l + (i+0.16)*(w-pad.l-pad.r)/labels.length;
      const bh = ((values[i]||0)/max)*(h-pad.t-pad.b);
      const y = h-pad.b-bh;
      ctx.fillStyle = color;
      ctx.fillRect(x,y,bw,bh);
      ctx.fillStyle = '#d9e5ef';
      ctx.save();
      ctx.translate(x+4,h-pad.b+12);
      ctx.rotate(-0.45);
      ctx.font = `${Math.max(10,w*0.011)}px Segoe UI`;
      ctx.fillText(lab,0,0);
      ctx.restore();
    });
  },
  line(canvas, labels, values, title="Line Chart", color='#4ad29f'){
    this.fitCanvas(canvas);
    const ctx = this.clear(canvas);
    const w = canvas.width, h = canvas.height;
    const pad = {l:50,r:20,t:40,b:60};
    const max = Math.max(...values,1), min = Math.min(...values,0);
    const span = Math.max(max-min,1e-9);
    ctx.fillStyle = '#e8eef4';
    ctx.font = `${Math.max(15,w*0.02)}px Segoe UI`;
    ctx.fillText(title, pad.l, 26);

    ctx.strokeStyle = '#31506b';
    for(let i=0;i<=5;i++){
      const y = pad.t + (h-pad.t-pad.b)*i/5;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
      const val = max - span*i/5;
      ctx.fillStyle = '#9fb4c6';
      ctx.font = `${Math.max(11,w*0.012)}px Segoe UI`;
      ctx.fillText(Util.fmt(val,1), 5, y+4);
    }

    const pts = labels.map((lab,i)=>{
      const x = pad.l + (labels.length===1?0:(i*(w-pad.l-pad.r)/(labels.length-1)));
      const y = h-pad.b - ((values[i]-min)/span)*(h-pad.t-pad.b);
      return [x,y];
    });

    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    pts.forEach((p,i)=> i===0 ? ctx.moveTo(p[0],p[1]) : ctx.lineTo(p[0],p[1]));
    ctx.stroke();

    pts.forEach((p,i)=>{
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(p[0],p[1],4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#d9e5ef';
      ctx.font = `${Math.max(10,w*0.011)}px Segoe UI`;
      ctx.fillText(labels[i], p[0]-8, h-pad.b+16);
    });
  },
  radarFallback(canvas, metrics, current, targetMin, targetMax, title="Property Comparison"){
    this.fitCanvas(canvas);
    const ctx = this.clear(canvas);
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#e8eef4';
    ctx.font = `${Math.max(15,w*0.02)}px Segoe UI`;
    ctx.fillText(title, 16, 24);

    const rows = metrics.map((m,i)=>{
      const c = current[i] ?? 0;
      const mn = targetMin[i] ?? 0;
      const mx = targetMax[i] ?? Math.max(c,1);
      const norm = mx>0 ? Math.min(1, c/mx) : 0;
      return {m,c,mn,mx,norm};
    });

    const x0 = 16, y0 = 50, rowH = 28, maxW = w - 240;
    rows.forEach((r,i)=>{
      const y = y0 + i*rowH;
      ctx.fillStyle = '#b9c9d6';
      ctx.font = `${Math.max(12,w*0.013)}px Segoe UI`;
      ctx.fillText(r.m, x0, y+14);
      ctx.strokeStyle = '#31506b';
      ctx.strokeRect(180,y,maxW,14);
      ctx.fillStyle = '#3aa3ff';
      ctx.fillRect(180,y,maxW*r.norm,14);
      ctx.fillStyle = '#e8eef4';
      ctx.fillText(`${Util.fmt(r.c,2)} [${Util.fmt(r.mn,2)}-${Util.fmt(r.mx,2)}]`, 190+maxW+10, y+12);
    });
  }
};

                  <th>Supplier</th>
                  <th>Grade</th>
                  <th>%</th>
                  <th>kg/batch</th>
                  <th>Price/kg</th>
                  <th>Cost/kg</th>

              <tbody>

                    <td>${it.category}</td>
                    <td>
                      <select data-row="${idx}" data-field="materialId" class="fi">

                    <td>${Util.fmt(it.totalCost,2)}</td>
                    <td><input data-row="${idx}" data-field="density" class="fi" type="number" step="0.0001" value="${Util.num(it.density)}"></td>

            <div class="kpi"><div class="label">Batch weight</div><div class="value">${Util.fmt(r.totalBatchKg,2)} kg</div></div>
            <div class="kpi"><div class="label">Material cost/kg</div><div class="value">₹ ${Util.fmt(r.formulationCostPerKg,2)}</div></div>
            <div class="kpi"><div class="label">Total material cost</div><div class="value">₹ ${Util.fmt(r.totalMaterialCost,2)}</div></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>Immediate Combined Theoretical Properties</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Property</th><th>Value</th><th>Method</th><th>Audit</th></tr></thead>
                <tbody>
                  ${PROPERTY_DEFS.map(pd=>{
                    const eq = getEquation(pd.key);
                    return `<tr>
                      <td>${pd.label}</td>
                      <td>${Util.fmt(r.properties[pd.key],4)} ${pd.unit}</td>
                      <td>${eq?.method || pd.method}</td>
                      <td><button class="btn secondary small" onclick="UI.showCalcExplain('${pd.key}')">How was this calculated?</button></td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <h3>Revision History</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Revision</th><th>Date</th><th>Engineer</th><th>Reason</th><th>Changes</th></tr></thead>
                <tbody>
                  ${State.data.revisions.filter(rv=>rv.formulationId===f.id).map(rv=>`
                    <tr>

      </div>

    return `
      <div class="layout">
        <div class="card">
          <div class="section-title">
            <h3>Property Models and Combined Formulation Properties</h3>

              <button class="btn secondary" onclick="Actions.modelCalibration()">Model Calibration</button>

            <label>Machine Cost /kg<input id="c_machine" type="number" step="0.01" value="${c.machinePerKg || 0}"></label>

            <label>Overhead /kg<input id="c_overhead" type="number" step="0.01" value="${c.overheadPerKg || 0}"></label>

                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

  viewBatchCalculator(){
    const f = getActiveFormulation();
    if(!f) return `<div class="card">No active formulation.</div>`;
    const r = Calc.computeFormulation(f);
    const invMap = Object.fromEntries(State.data.inventory.map(i=>[i.materialId,i]));
    const canProduce = f.items.every(it=>{
      const inv = invMap[it.materialId];
      if(!it.materialId || Util.num(it.percent)<=0) return true;
      return inv ? Util.num(inv.availableKg) >= Util.num(it.kgBatch) : false;
    });

    return `
      <div class="layout">
        <div class="card">
          <div class="section-title">
            <h3>Batch Calculator</h3>
            <div class="toolbar">
              <button class="btn secondary" onclick="window.print()">Print Batch Sheet</button>
              <button class="btn secondary" onclick="Actions.exportBatchSheet()">Export Batch Sheet</button>
            </div>
          </div>
          <div class="note">User enters batch size via active formulation target weight. Current stock sufficiency is evaluated from optional inventory records.</div>
          <div class="kpi-grid">
            <div class="kpi"><div class="label">Batch Size</div><div class="value">${Util.fmt(f.targetWeightKg,2)} kg</div></div>
            <div class="kpi"><div class="label">Total Material Cost</div><div class="value">₹ ${Util.fmt(r.totalMaterialCost,2)}</div></div>
            <div class="kpi"><div class="label">Can Current Stock Produce?</div><div class="value" style="font-size:20px">${canProduce?'YES':'NO'}</div></div>
            <div class="kpi"><div class="label">Cost/kg</div><div class="value">₹ ${Util.fmt(r.formulationCostPerKg,2)}</div></div>
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Material</th><th>%</th><th>kg/batch</th><th>Price/kg</th><th>Cost</th><th>Available Stock</th><th>Status</th></tr></thead>
              <tbody>
              ${f.items.map(it=>{
                const inv = invMap[it.materialId] || {};
                const ok = Util.num(inv.availableKg) >= Util.num(it.kgBatch) || Util.num(it.kgBatch)===0;
                return `<tr>
                  <td>${it.ingredient}</td>
                  <td>${Util.fmt(it.percent,3)}</td>
                  <td>${Util.fmt(it.kgBatch,3)}</td>
                  <td>${Util.fmt(it.pricePerKg,2)}</td>
                  <td>${Util.fmt(it.totalCost,2)}</td>
                  <td>${Util.fmt(inv.availableKg||0,2)}</td>
                  <td class="${ok?'ok':'danger'}">${ok?'OK':'Insufficient'}</td>
                </tr>`;
              }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  },

  viewComparison(){
    return `

  renderComparisonResults(){
    const ids = State.compareIds.slice(0,5);
    if(!ids.length) return `<div class="subtle">No formulations selected.</div>`;
    const forms = ids.map(id=>State.data.formulations.find(f=>f.id===id)).filter(Boolean);
    if(!forms.length) return `<div class="subtle">No formulations selected.</div>`;
    const res = forms.map(f=>({f,r:Calc.computeFormulation(f)}));
    const props = ["density","tensileStrength","flexuralStrength","flexuralModulus","HDT","shrinkage","viscosity","gelTime"];
    return `
      <h3>Comparison Table</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Metric</th>${forms.map(f=>`<th>${f.name}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td>Cost/kg</td>${res.map(x=>`<td>${Util.fmt(x.r.formulationCostPerKg,3)}</td>`).join('')}</tr>
            <tr><td>Total %</td>${res.map(x=>`<td>${Util.fmt(x.r.totalPercent,3)}</td>`).join('')}</tr>
            ${props.map(p=>{
              const pd = PROPERTY_DEFS.find(x=>x.key===p);
              return `<tr><td>${pd.label} (${pd.unit})</td>${res.map(x=>`<td>${Util.fmt(x.r.properties[p],3)}</td>`).join('')}</tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="grid-2" style="margin-top:12px">
        <canvas id="cmpCostChart" style="height:280px"></canvas>
        <canvas id="cmpDensityChart" style="height:280px"></canvas>
      </div>
    `;
  },

  viewExperimental(){
    const f = getActiveFormulation();
    if(!f) return `<div class="card">No active formulation.</div>`;
    const exp = State.data.experimentalData.filter(x=>x.formulationId===f.id);
    const r = Calc.computeFormulation(f);
    return `
      <div class="layout">
        <div class="card">
          <div class="section-title">
            <h3>Experimental Data Module</h3>
            <div class="toolbar">
              <button class="btn good" onclick="Actions.addExperimentalData()">Add Experimental Result</button>
            </div>
          </div>
          <div class="note">Theoretical vs experimental comparison is intended for engineering correlation, not automatic scientific validation.</div>
        </div>

        <div class="card">
          <h3>Current Predicted vs Experimental</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Property</th><th>Predicted</th><th>Experimental</th><th>Error %</th><th>Notes</th></tr></thead>
              <tbody>
                ${exp.flatMap(e=>{
                  return Object.entries(e.results || {}).map(([k,v])=>{
                    const pred = Util.num(r.properties[k]);
                    const ex = Util.num(v);
                    const err = ex!==0 ? ((ex-pred)/ex)*100 : 0;
                    const pd = PROPERTY_DEFS.find(p=>p.key===k);
                    return `<tr>
                      <td>${e.date}</td>
                      <td>${pd?.label || k}</td>
                      <td>${Util.fmt(pred,3)}</td>
                      <td>${Util.fmt(ex,3)}</td>
                      <td>${Util.fmt(err,2)}</td>
                      <td>${e.notes || '-'}</td>
                    </tr>`;
                  });
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

  bindView(){
    const f = getActiveFormulation();

    // Dashboard charts
    if(State.currentView==="Dashboard" && f){
      const r = Calc.computeFormulation(f);
      const labels = f.items.map(it=>it.category);
      const vals = f.items.map(it=>Util.num(it.percent));
      const colors = labels.map((_,i)=>`hsl(${(i*37)%360} 70% 56%)`);
      const c1 = document.getElementById('chartComposition');
      const c2 = document.getElementById('chartCostContribution');
      const c3 = document.getElementById('chartPropertyCompare');
      if(c1) Charts.donut(c1, labels, vals, colors, "SMC Composition");
      if(c2) Charts.bars(c2, labels, f.items.map(it=>Util.num(it.totalCost)), "Material Cost Contribution", "#4ad29f");
      if(c3){
        const metrics = ["Strength","Modulus","HDT","Impact","Density","Shrinkage"];
        const cur = [r.properties.tensileStrength, r.properties.flexuralModulus, r.properties.HDT, r.properties.impactStrength, r.properties.density, r.properties.shrinkage];
        const mins = [0,0,0,0,0,0];
        const maxs = [
          f.targetProperties.tensileStrength.max || Math.max(cur[0],1),
          f.targetProperties.flexuralModulus.max || Math.max(cur[1],1),
          f.targetProperties.HDT.max || Math.max(cur[2],1),
          f.targetProperties.impactStrength.max || Math.max(cur[3],1),
          f.targetProperties.density.max || Math.max(cur[4],1),
          f.targetProperties.shrinkage.max || Math.max(cur[5],1)
        ].map(Util.num);
        Charts.radarFallback(c3, metrics, cur, mins, maxs, "Normalized Property Visualization");
      }
      const btn = document.getElementById('btnOpenFormulationEditor');
      if(btn) btn.onclick = ()=>{ State.currentView="Formulations"; UI.render(); };
    }

    // Formulation editor live bind
    if(State.currentView==="Formulations" && f){
      const bindSimple = (id,key,convert=(v)=>v)=>{
        const el = document.getElementById(id);
        if(el) el.oninput = ()=>{ f[key] = convert(el.value); f.modifiedDate = Util.today(); UI.render(); };
      };
      bindSimple('f_formulationId','formulationId');
      bindSimple('f_name','name');
      bindSimple('f_application','application');
      bindSimple('f_customer','customer');
      bindSimple('f_partName','partName');
      bindSimple('f_partNumber','partNumber');
      bindSimple('f_revision','revision');
      bindSimple('f_engineer','engineer');
      bindSimple('f_plant','plant');
      bindSimple('f_process','manufacturingProcess');
      bindSimple('f_targetWeightKg','targetWeightKg',Util.num);
      bindSimple('f_notes','notes');
      const an = document.getElementById('f_autoNormalize');
      if(an) an.onchange = ()=>{ f.autoNormalize = an.value==="true"; f.modifiedDate = Util.today(); UI.render(); };

      document.querySelectorAll('.fi').forEach(el=>{
        el.oninput = el.onchange = ()=>{
          const idx = Number(el.dataset.row), field = el.dataset.field;
          const item = f.items[idx];
          if(!item) return;
          item[field] = ["percent","pricePerKg","density"].includes(field) ? Util.num(el.value) : el.value;
          if(field==="materialId"){
            Calc.hydrateItemFromMaterial(item);
          }
          const settings = getSettings();
          if(item.logistics && item.logistics.toggles){
            item.logistics.toggles = {...settings.costToggles, ...item.logistics.toggles};
          }
          f.modifiedDate = Util.today();
          UI.render();
        };
      });
    }

    // What-if chart
    if(State.currentView==="What-if Analysis" && State.lastWhatIf && State.lastWhatIf.length){
      const c = document.getElementById('chartWhatIf');
      if(c){
        Charts.line(c, State.lastWhatIf.map(x=>Util.fmt(x.percent,1)), State.lastWhatIf.map(x=>x.flexuralModulus), "Sensitivity: Ingredient % vs Flexural Modulus", "#ffb648");
      }
    }

    // Comparison chart
    if(State.currentView==="Comparison" && State.compareIds.length){
      const forms = State.compareIds.slice(0,5).map(id=>State.data.formulations.find(f=>f.id===id)).filter(Boolean);
      const res = forms.map(f=>Calc.computeFormulation(f));
      const cc = document.getElementById('cmpCostChart');
      const dc = document.getElementById('cmpDensityChart');
      if(cc) Charts.bars(cc, forms.map(f=>f.name), res.map(r=>r.formulationCostPerKg), "Cost/kg Comparison", "#3aa3ff");
      if(dc) Charts.bars(dc, forms.map(f=>f.name), res.map(r=>r.properties.density), "Density Comparison", "#4ad29f");
      document.querySelectorAll('.cmpChk').forEach(ch=>{
        ch.onchange = ()=>{
          const v = ch.value;
          if(ch.checked){
            if(!State.compareIds.includes(v) && State.compareIds.length<5) State.compareIds.push(v);
          }else{
            State.compareIds = State.compareIds.filter(x=>x!==v);
          }
        };
      });
    }

    // New formulation buttons
    if(State.currentView==="New Formulation"){
      const val = id=>document.getElementById(id)?.value || "";
      const fillMeta = frm=>{
        frm.application = val("nf_app");
        frm.engineer = val("nf_engineer");
        frm.plant = val("nf_plant");
      };
      document.getElementById('createBlank').onclick = async ()=>{
        const frm = createBlankFormulation(val("nf_name") || "New SMC Formulation", val("nf_app"));
        fillMeta(frm);
        State.data.formulations.push(frm);
        setActiveFormulation(frm.id);
        await saveAllData();
        State.currentView = "Formulations";
        UI.render();
      };
      document.getElementById('createFromPreset').onclick = ()=>{
        Actions.createFromPresetDialog(val("nf_name") || "Preset Formulation", val("nf_app"), val("nf_engineer"), val("nf_plant"));
      };
      document.getElementById('duplicateExisting').onclick = ()=>{
        Actions.duplicateFormulationDialog();
      };
      document.getElementById('createFromRevision').onclick = ()=>{
        Actions.createFromRevisionDialog();
      };
      document.getElementById('importFormulationBtn').onclick = ()=>Actions.importData();
    }
  },

  showCalcExplain(propertyKey){
    const f = getActiveFormulation();
    if(!f) return;
    UI.modal("Calculation Transparency", Calc.explainProperty(f, propertyKey));
  }
};

/* -------------------------
   Actions
------------------------- */
const Actions = {
  async saveActiveFormulation(){
    const f = getActiveFormulation();
    if(!f) return;
    f.modifiedDate = Util.today();
    await saveAllData();
    alert("Formulation saved.");
  },

  openFormulation(id){
    setActiveFormulation(id);
    State.currentView = "Formulations";
    UI.render();
  },

  async duplicateFormulation(id){
    const src = State.data.formulations.find(f=>f.id===id);
    if(!src) return;
    const x = Util.clone(src);
    x.id = Util.uid("FORM");
    x.formulationId = Util.uid("F");
    x.name = src.name + " (Copy)";
    x.createdDate = Util.today();
    x.modifiedDate = Util.today();
    x.revision = src.revision;
    x.items.forEach(it=>it.id = Util.uid("FI"));
    State.data.formulations.push(x);
    setActiveFormulation(x.id);
    await saveAllData();
    State.currentView = "Formulations";
    UI.render();
  },

  duplicateFormulationDialog(){
    UI.modal("Duplicate Existing Formulation", `
      <div class="list">
        ${State.data.formulations.map(f=>`
          <div class="list-item">
            <b>${f.name}</b><div class="mini">${f.formulationId} | Rev ${f.revision}</div>
            <div style="margin-top:8px"><button class="btn good" onclick="Actions.duplicateFormulation('${f.id}');UI.closeModal()">Duplicate</button></div>
          </div>
        `).join('')}
      </div>
    `);
  },

  async newRevision(id){
    const src = State.data.formulations.find(f=>f.id===id);
    if(!src) return;
    const nextRev = String.fromCharCode((src.revision || "A").charCodeAt(0)+1);
    const x = Util.clone(src);
    const prev = Util.clone(src);
    x.id = Util.uid("FORM");
    x.formulationId = src.formulationId;
    x.revision = nextRev;
    x.name = src.name + " Rev " + nextRev;
    x.createdDate = Util.today();
    x.modifiedDate = Util.today();
    x.items.forEach(it=>it.id = Util.uid("FI"));
    State.data.formulations.push(x);
    State.data.revisions.push({
      id:Util.uid("REV"),
      formulationId:x.id,
      revision:nextRev,
      date:Util.today(),
      engineer:x.engineer || "",
      changes:"New revision created",
      previousFormulation:prev,
      newFormulation:Util.clone(x),
      reason:"Revision increment",
      notes:""
    });
    setActiveFormulation(x.id);
    await saveAllData();
    State.currentView="Formulations";
    UI.render();
  },

  createFromRevisionDialog(){
    UI.modal("Create From Previous Revision", `
      <div class="list">
        ${State.data.revisions.map(rv=>`
          <div class="list-item">
            <b>Revision ${rv.revision}</b>
            <div class="mini">${rv.date} | ${rv.engineer || '-'}</div>
            <div class="mini">${rv.reason || '-'}</div>
            <div style="margin-top:8px"><button class="btn good" onclick="Actions.createFromRevision('${rv.id}');UI.closeModal()">Create Formulation</button></div>
          </div>
        `).join('')}
      </div>
    `);
  },

  async createFromRevision(revId){
    const rv = State.data.revisions.find(r=>r.id===revId);
    if(!rv || !rv.newFormulation) return;
    const x = Util.clone(rv.newFormulation);
    x.id = Util.uid("FORM");
    x.formulationId = Util.uid("F");
    x.name = (x.name || "Revision Clone") + " (From Revision)";
    x.createdDate = Util.today();
    x.modifiedDate = Util.today();
    x.items.forEach(it=>it.id = Util.uid("FI"));
    State.data.formulations.push(x);
    setActiveFormulation(x.id);
    await saveAllData();
    State.currentView = "Formulations";
    UI.render();
  },

  previewPreset(id){
    const p = State.data.presets.find(x=>x.id===id);
    if(!p) return;
    UI.modal("Preset Preview", `
      <div class="card">
        <h3>${p.name}</h3>
        <div class="note">Starting formulation / engineering preset — editable</div>
        <div class="table-wrap" style="margin-top:10px">
          <table>
            <thead><tr><th>Category</th><th>%</th></tr></thead>
            <tbody>${p.composition.map(c=>`<tr><td>${c.category}</td><td>${c.percent}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    `);
  },

  createFromPresetDialog(defaultName, defaultApp, engineer, plant){
    UI.modal("Create From Preset", `
      <div class="list">
        ${State.data.presets.map(p=>{
          const app = State.data.applications.find(a=>a.id===p.applicationId);
          return `<div class="list-item">
            <b>${p.name}</b>
            <div class="mini">${app?.name || '-'}</div>
            <div style="margin-top:8px"><button class="btn good" onclick="Actions.createFromPreset('${p.id}','${encodeURIComponent(defaultName)}','${encodeURIComponent(defaultApp)}','${encodeURIComponent(engineer)}','${encodeURIComponent(plant)}');UI.closeModal()">Create</button></div>
          </div>`;
        }).join('')}
      </div>
    `);
  },

  async createFromPreset(presetId, name, app, engineer, plant){
    const p = State.data.presets.find(x=>x.id===presetId);
    if(!p) return;
    const appObj = State.data.applications.find(a=>a.id===p.applicationId);
    const frm = createBlankFormulation(decodeURIComponent(name || "Preset Formulation"), decodeURIComponent(app || appObj?.name || ""));
    frm.engineer = decodeURIComponent(engineer || "");
    frm.plant = decodeURIComponent(plant || "");
    frm.items.forEach(it=>{
      const pc = p.composition.find(x=>x.category===it.category);
      if(pc) it.percent = Util.num(pc.percent);
      const mat = State.data.materials.find(m=>m.category===it.category);

  async runWhatIf(){
    const f = getActiveFormulation();
    if(!f) return;
    const itemId = document.getElementById('wi_material').value;
    const mn = Util.num(document.getElementById('wi_min').value);
    const mx = Util.num(document.getElementById('wi_max').value);
    const step = Util.num(document.getElementById('wi_step').value);
    const item = f.items.find(x=>x.id===itemId);
    if(!item || step<=0 || mx<mn) return alert("Invalid what-if range.");
    const rows = [];
    const base = Util.clone(f);
    for(let p=mn; p<=mx+1e-9; p+=step){
      const x = Util.clone(base);
      const target = x.items.find(z=>z.id===itemId);
      target.percent = p;
      const rr = Calc.computeFormulation(x);
      rows.push({
        percent:p,
        density:rr.properties.density,
        tensileStrength:rr.properties.tensileStrength,
        flexuralStrength:rr.properties.flexuralStrength,
        flexuralModulus:rr.properties.flexuralModulus,
        HDT:rr.properties.HDT,
        costPerKg:rr.formulationCostPerKg
      });
    }
    State.lastWhatIf = rows;
    UI.render();
  },

  modelCalibration(){
    const rows = State.data.experimentalData;
    if(!rows.length){
      return UI.modal("Model Calibration", `<div class="card"><p>No experimental data available. Add experimental results first.</p></div>`);
    }
    const keys = ["density","tensileStrength","flexuralStrength","impactStrength","HDT","shrinkage"];
    let html = `<div class="card"><h3>Engineering correlation based on user data</h3><div class="note">This tool estimates simple correction factors from experimental data. It does not automatically validate a scientific model.</div></div>`;
    html += `<div class="table-wrap"><table><thead><tr><th>Property</th><th>Average Predicted</th><th>Average Experimental</th><th>Suggested CF</th></tr></thead><tbody>`;
    keys.forEach(key=>{
      let predSum=0, expSum=0, n=0;
      rows.forEach(e=>{
        const f = State.data.formulations.find(x=>x.id===e.formulationId);
        if(!f) return;
        const pred = Calc.computeFormulation(f).properties[key];
        const ex = Util.num(e.results?.[key], NaN);
        if(isFinite(ex) && isFinite(pred) && ex!==0){
          predSum += pred; expSum += ex; n++;
        }
      });
      const avgPred = n?predSum/n:0, avgExp = n?expSum/n:0, cf = avgPred!==0 ? avgExp/avgPred : 1;
      html += `<tr><td>${key}</td><td>${Util.fmt(avgPred,4)}</td><td>${Util.fmt(avgExp,4)}</td><td>${Util.fmt(cf,4)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    html += `<div class="sticky-actions"><button class="btn good" onclick="Actions.applySuggestedCalibration()">Apply Suggested Calibration</button></div>`;
    UI.modal("Model Calibration", html);
  },

  async applySuggestedCalibration(){
    const rows = State.data.experimentalData;
    const keys = ["density","tensileStrength","flexuralStrength","impactStrength","HDT","shrinkage"];
    keys.forEach(key=>{
      let predSum=0, expSum=0, n=0;
      rows.forEach(e=>{
        const f = State.data.formulations.find(x=>x.id===e.formulationId);
        if(!f) return;
        const pred = Calc.computeFormulation(f).properties[key];
        const ex = Util.num(e.results?.[key], NaN);
        if(isFinite(ex) && isFinite(pred) && ex!==0){
          predSum += pred; expSum += ex; n++;
        }
      });
      const avgPred = n?predSum/n:0, avgExp = n?expSum/n:0, cf = avgPred!==0 ? avgExp/avgPred : 1;
      const eq = getEquation(key);
      if(eq) eq.correctionFactor = cf;
    });
    await saveAllData();
    UI.closeModal();
    UI.render();
  },

    if(!s) return;
    const keys = Object.keys(s).filter(k=>k!=="id");
    UI.modal("Edit Supplier", `
      <div class="three-col">
        ${keys.map(k=>`<label>${k}<input id="se_${k}" value="${String(s[k]??"").replace(/"/g,'&quot;')}"></label>`).join('')}
      </div>
      <div class="sticky-actions"><button class="btn good" onclick="Actions.saveSupplierEdit('${id}')">Save</button></div>
    `);
  },

  async saveSupplierEdit(id){
    const s = State.data.suppliers.find(x=>x.id===id);
    if(!s) return;
    Object.keys(s).forEach(k=>{
      if(k==="id") return;
      const el = document.getElementById('se_'+k);
      if(el) s[k] = el.value;
    });

    UI.closeModal();

  },

  async deleteSupplier(id){
    if(!confirm("Delete supplier?")) return;
    State.data.suppliers = State.data.suppliers.filter(s=>s.id!==id);
    await saveAllData();
    UI.render();
  },

  exportSuppliers(){
    Util.download("suppliers.json", JSON.stringify(State.data.suppliers,null,2));
  },

    UI.modal("Add Application", `
      <div class="three-col">
        <label>Name<input id="ap_name"></label>

        <label>Resin max<input id="ap_resin_max" type="number" step="0.01"></label>
        <label>Filler min<input id="ap_filler_min" type="number" step="0.01"></label>
        <label>Filler max<input id="ap_filler_max" type="number" step="0.01"></label>
        <label>Glass min<input id="ap_glass_min" type="number" step="0.01"></label>
        <label>Glass max<input id="ap_glass_max" type="number" step="0.01"></label>
        <label>LPA min<input id="ap_lpa_min" type="number" step="0.01"></label>
        <label>LPA max<input id="ap_lpa_max" type="number" step="0.01"></label>
        <label>Catalyst min<input id="ap_cat_min" type="number" step="0.01"></label>
        <label>Catalyst max<input id="ap_cat_max" type="number" step="0.01"></label>
      </div>
      <div class="sticky-actions"><button class="btn good" onclick="Actions.saveApplication()">Save Application</button></div>
    `);
  },

  async saveApplication(){
    State.data.applications.push({
      id:Util.uid("APP"),
      name:document.getElementById('ap_name').value,
      notes:"Starting formulation / engineering preset — editable",
      targetRanges:{
        resin:[Util.num(document.getElementById('ap_resin_min').value), Util.num(document.getElementById('ap_resin_max').value)],
        filler:[Util.num(document.getElementById('ap_filler_min').value), Util.num(document.getElementById('ap_filler_max').value)],
        glass:[Util.num(document.getElementById('ap_glass_min').value), Util.num(document.getElementById('ap_glass_max').value)],
        lpa:[Util.num(document.getElementById('ap_lpa_min').value), Util.num(document.getElementById('ap_lpa_max').value)],
        catalyst:[Util.num(document.getElementById('ap_cat_min').value), Util.num(document.getElementById('ap_cat_max').value)],
        accelerator:[0,0], thickener:[0,0], pigment:[0,0], fr:[0,0], other:[0,0]
      },
      created:Util.today(),
      sourceType:"User-entered",
      confidence:"User-entered",
      reference:""
    });
    await saveAllData();
    UI.closeModal();
    UI.render();
  },

  openApplicationEditor(id){
    const a = State.data.applications.find(x=>x.id===id);
    if(!a) return;
    const t = a.targetRanges || {};
    const r = (k,idx)=>t[k]?.[idx] ?? "";
    UI.modal("Edit Application", `
      <div class="three-col">
        <label>Name<input id="ae_name" value="${a.name}"></label>
        ${["resin","filler","glass","lpa","catalyst","accelerator","thickener","pigment","fr","other"].map(k=>`
          <label>${k} min<input id="ae_${k}_min" type="number" step="0.01" value="${r(k,0)}"></label>
          <label>${k} max<input id="ae_${k}_max" type="number" step="0.01" value="${r(k,1)}"></label>
        `).join('')}
      </div>
      <div class="sticky-actions"><button class="btn good" onclick="Actions.saveApplicationEdit('${id}')">Save</button></div>
    `);
  },

  async saveApplicationEdit(id){
    const a = State.data.applications.find(x=>x.id===id);
    if(!a) return;
    a.name = document.getElementById('ae_name').value;
    ["resin","filler","glass","lpa","catalyst","accelerator","thickener","pigment","fr","other"].forEach(k=>{
      a.targetRanges[k] = [Util.num(document.getElementById(`ae_${k}_min`).value), Util.num(document.getElementById(`ae_${k}_max`).value)];
    });
    await saveAllData();
    UI.closeModal();
    UI.render();
  },

  addPreset(){
    UI.modal("Add Preset", `
      <div class="two-col">
        <label>Preset Name<input id="pr_name"></label>
        <label>Application<select id="pr_app">${State.data.applications.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></label>
      </div>
      <div class="note" style="margin:10px 0">After saving, edit the preset composition in JSON via Database export/import or extend this editor as needed.</div>
      <div class="sticky-actions"><button class="btn good" onclick="Actions.savePreset()">Save Preset</button></div>
    `);
  },

  async savePreset(){
    State.data.presets.push({
      id:Util.uid("PRE"),
      applicationId:document.getElementById('pr_app').value,
      name:document.getElementById('pr_name').value,
      editable:true,
      composition:DEFAULT_MATERIAL_GROUPS.map(cat=>({category:cat,percent:0})),
      sourceType:"User-entered",
      confidence:"User-entered",
      reference:"",
      created:Util.today()
    });
    await saveAllData();
    UI.closeModal();
    UI.render();
  },

  async saveSettings(){
    const s = getSettings();
    s.unitsSystem = document.getElementById('set_units').value;
    s.defaultCurrency = document.getElementById('set_cur').value;
    s.exchangeRates.USD = Util.num(document.getElementById('set_usd').value,83);
    s.exchangeRates.CNY = Util.num(document.getElementById('set_cny').value,11.5);
    s.exchangeRates.EUR = Util.num(document.getElementById('set_eur').value,90);
    s.costToggles.freight = document.getElementById('set_freight').value==="true";
    s.costToggles.insurance = document.getElementById('set_insurance').value==="true";
    s.costToggles.duty = document.getElementById('set_duty').value==="true";
    s.costToggles.gst = document.getElementById('set_gst').value==="true";
    s.costToggles.other = document.getElementById('set_other').value==="true";
    await saveAllData();
    UI.render();
    alert("Settings saved.");
  },

  editInventory(id){
    const inv = State.data.inventory.find(x=>x.id===id);
    if(!inv) return;
    UI.modal("Edit Inventory", `
      <div class="two-col">
        <label>Current Stock (kg)<input id="iv_cur" type="number" step="0.01" value="${inv.currentStockKg || 0}"></label>
        <label>Minimum Stock (kg)<input id="iv_min" type="number" step="0.01" value="${inv.minStockKg || 0}"></label>
        <label>Maximum Stock (kg)<input id="iv_max" type="number" step="0.01" value="${inv.maxStockKg || 0}"></label>
        <label>Reserved Quantity (kg)<input id="iv_res" type="number" step="0.01" value="${inv.reservedKg || 0}"></label>
        <label>Supplier<input id="iv_sup" value="${inv.supplier || ''}"></label>
        <label>Lead Time<input id="iv_lt" value="${inv.leadTime || ''}"></label>
        <label>Last Purchase Price<input id="iv_lpp" type="number" step="0.01" value="${inv.lastPurchasePrice || 0}"></label>
        <label>Current Price<input id="iv_cp" type="number" step="0.01" value="${inv.currentPrice || 0}"></label>
        <label>Price Trend<input id="iv_trend" value="${inv.priceTrend || ''}"></label>
      </div>
      <div class="sticky-actions"><button class="btn good" onclick="Actions.saveInventory('${id}')">Save</button></div>
    `);
  },

  async saveInventory(id){
    const inv = State.data.inventory.find(x=>x.id===id);
    if(!inv) return;
    inv.currentStockKg = Util.num(document.getElementById('iv_cur').value);
    inv.minStockKg = Util.num(document.getElementById('iv_min').value);
    inv.maxStockKg = Util.num(document.getElementById('iv_max').value);
    inv.reservedKg = Util.num(document.getElementById('iv_res').value);
    inv.availableKg = inv.currentStockKg - inv.reservedKg;
    inv.supplier = document.getElementById('iv_sup').value;
    inv.leadTime = document.getElementById('iv_lt').value;
    inv.lastPurchasePrice = Util.num(document.getElementById('iv_lpp').value);
    inv.currentPrice = Util.num(document.getElementById('iv_cp').value);
    inv.priceTrend = document.getElementById('iv_trend').value;
    await saveAllData();
    UI.closeModal();
    UI.render();
  },

  exportBatchSheet(){
    const f = getActiveFormulation();
    if(!f) return;
    const r = Calc.computeFormulation(f);
    let csv = "Material,Percent,Kg per Batch,Price per Kg,Total Cost\n";
    f.items.forEach(it=>{
      csv += [
        Util.csvEscape(it.ingredient),
        it.percent,
        it.kgBatch,
        it.pricePerKg,
        it.totalCost
      ].join(",") + "\n";
    });
    csv += `Total,${r.totalPercent},${r.totalBatchKg},,${r.totalMaterialCost}\n`;
    Util.download("Batch_Sheet.csv", csv, "text/csv");
  },

  exportJSON(){
    Util.download("SMC_Workbench_Backup.json", JSON.stringify(State.data,null,2));
  },

  exportExcelCompatible(){
    const f = getActiveFormulation();
    const r = f ? Calc.computeFormulation(f) : null;
    const whatif = State.lastWhatIf || [];
    const revs = f ? State.data.revisions.filter(rv=>rv.formulationId===f.id) : [];
    const xml = SpreadsheetML.build({
      formulation:f, results:r,
      materials:State.data.materials,
      suppliers:State.data.suppliers,
      priceHistory:State.data.priceHistory,
      whatif,
      revisions:revs
    });
    Util.download("SMC_Workbench_Export.xml", xml, "application/vnd.ms-excel");
  },

  importData(){
    const fi = document.getElementById('fileInput');
    fi.value = "";
    fi.accept = ".json,.csv,.xml,.txt";
    fi.onchange = async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const text = await file.text();
      try{
        if(file.name.toLowerCase().endsWith('.json')){
          const obj = JSON.parse(text);
          if(obj.formulations || obj.materials || obj.suppliers){
            if(confirm("Replace current database with imported JSON?")){
              DB.stores.forEach(s=>{ if(obj[s]) State.data[s] = obj[s]; });
              await saveAllData();
              if(State.data.formulations.length) State.activeFormulationId = State.data.formulations[0].id;
              UI.render();
              alert("JSON imported.");
            }
          }else{
            const single = obj;
            if(single.items){
              single.id = Util.uid("FORM");
              single.formulationId = single.formulationId || Util.uid("F");
              State.data.formulations.push(single);
              State.activeFormulationId = single.id;
              await saveAllData();
              UI.render();
              alert("Formulation imported.");
            }
          }
        }else if(file.name.toLowerCase().endsWith('.csv')){
          const rows = Util.parseCSV(text);
          alert("CSV parsed. For this offline build, use JSON for full-fidelity import. CSV import can be extended per your company schema.");
          console.log(rows);
        }else{
          alert("Excel-compatible XML import is not fully mapped in this build. Use JSON for robust import.");
        }
      }catch(err){
        alert("Import failed: " + err.message);
      }
    };
    fi.click();
  },

  async factoryReset(){
    if(!confirm("Reset factory presets and demo database? This will overwrite current stored data.")) return;
    const init = createInitialData();
    for(const store of DB.stores){
      State.data[store] = init[store] || [];
    }
    await saveAllData();
    State.activeFormulationId = State.data.formulations[0]?.id || null;
    UI.render();
  }
};

/* -------------------------
   SpreadsheetML export
------------------------- */
const SpreadsheetML = {
  esc(s){
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  },
  cell(v){
    return `<Cell><Data ss:Type="String">${this.esc(v)}</Data></Cell>`;
  },
  row(arr){
    return `<Row>${arr.map(v=>this.cell(v)).join('')}</Row>`;
  },
  table(rows){
    return `<Table>${rows.join('')}</Table>`;
  },
  sheet(name, rows){
    return `<Worksheet ss:Name="${this.esc(name)}">${this.table(rows)}</Worksheet>`;
  },
  build({formulation,results,materials,suppliers,priceHistory,whatif,revisions}){
    const ssTop = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">`;
    const ssEnd = `</Workbook>`;

    const sh1 = [];
    sh1.push(this.row(["Formulation Summary"]));
    if(formulation){
      [["Formulation ID",formulation.formulationId],["Name",formulation.name],["Application",formulation.application],["Revision",formulation.revision],["Engineer",formulation.engineer],["Target Weight kg",formulation.targetWeightKg],["Notes",formulation.notes]].forEach(r=>sh1.push(this.row(r)));
    }

    const sh2 = [this.row(["Composition"]), this.row(["Ingredient","Supplier","Grade","Percent","kg/batch","Price/kg","Cost/kg","Total Cost","Density","Function"])];
    (formulation?.items || []).forEach(it=>sh2.push(this.row([it.ingredient,it.supplier,it.grade,it.percent,it.kgBatch,it.pricePerKg,it.costPerKg,it.totalCost,it.density,it.function])));

    const sh3 = [this.row(["Material Properties"]), this.row(["Category","Material Name","Grade","Supplier","Density","Tensile Strength","Flexural Strength","Flexural Modulus","HDT","Price/kg","Currency","Source","Confidence","Reference"])];
    materials.forEach(m=>sh3.push(this.row([m.category,m.materialName,m.grade,m.supplier,m.density,m.tensileStrength,m.flexuralStrength,m.flexuralModulus,m.HDT,m.pricePerKg,m.currency,m.sourceType,m.confidence,m.reference])));

    const sh4 = [this.row(["Supplier Data"]), this.row(["Supplier ID","Company","Type","Category","Grade","Product","Country","City","State","Website","Contact","Price","Currency","MOQ","Lead Time","Source","Reliability"])];
    suppliers.forEach(s=>sh4.push(this.row([s.supplierId,s.companyName,s.manufacturerDistributor,s.materialCategory,s.materialGrade,s.productName,s.country,s.city,s.state,s.website,s.contactInformation,s.price,s.priceCurrency,s.moq,s.leadTime,s.sourceReference,s.reliabilityStatus])));

    const sh5 = [this.row(["Pricing"]), this.row(["Date","Material ID","Supplier","Grade","INR/kg","USD/kg","CNY/kg","EUR/kg","Source","Confidence"])];
    priceHistory.forEach(p=>sh5.push(this.row([p.date,p.materialId,p.supplier,p.grade,p.INRkg,p.USDkg,p.CNYkg,p.EURkg,p.sourceType,p.confidence])));

    const sh6 = [this.row(["Cost Calculation"])];
    if(results){
      [["Total Percent",results.totalPercent],["Total Batch kg",results.totalBatchKg],["Total Material Cost",results.totalMaterialCost],["Formulation Cost/kg",results.formulationCostPerKg],["Manufacturing Cost/kg",results.manufacturingCostPerKg],["Selling Price/kg",results.sellingPricePerKg]].forEach(r=>sh6.push(this.row(r)));
    }

    const sh7 = [this.row(["Combined Properties"]), this.row(["Property","Value"])];
    if(results) PROPERTY_DEFS.forEach(p=>sh7.push(this.row([`${p.label} (${p.unit})`, results.properties[p.key]])));

    const sh8 = [this.row(["Batch Calculation"]), this.row(["Material","Percent","kg/batch","Price/kg","Total Cost"])];
    (formulation?.items || []).forEach(it=>sh8.push(this.row([it.ingredient,it.percent,it.kgBatch,it.pricePerKg,it.totalCost])));

    const sh9 = [this.row(["What-if Analysis"]), this.row(["Ingredient Percent","Density","Tensile","Flexural","Modulus","HDT","Cost/kg"])];
    whatif.forEach(w=>sh9.push(this.row([w.percent,w.density,w.tensileStrength,w.flexuralStrength,w.flexuralModulus,w.HDT,w.costPerKg])));

    const sh10 = [this.row(["Revision History"]), this.row(["Revision","Date","Engineer","Reason","Changes","Notes"])];
    revisions.forEach(rv=>sh10.push(this.row([rv.revision,rv.date,rv.engineer,rv.reason,rv.changes,rv.notes])));

    return ssTop
      + this.sheet("Formulation Summary", sh1)
      + this.sheet("Composition", sh2)
      + this.sheet("Material Properties", sh3)
      + this.sheet("Supplier Data", sh4)
      + this.sheet("Pricing", sh5)
      + this.sheet("Cost Calculation", sh6)
      + this.sheet("Combined Properties", sh7)
      + this.sheet("Batch Calculation", sh8)
      + this.sheet("What-if Analysis", sh9)
      + this.sheet("Revision History", sh10)
      + ssEnd;
  }
};
